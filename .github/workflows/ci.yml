name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the zip to this existing tag (example: v0.0.1). Empty skips the Release upload."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run zip
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-web-store-zip
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true
      - name: Attach zip to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          zips=(.output/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "no zip in .output" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${zips[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${zips[@]}" --title "$RELEASE_TAG" --generate-notes --target "${GITHUB_SHA}"
          fi
